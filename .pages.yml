                type: string
              - name: b3
                type: string
          - name: mode2
            type: object
            label: ODC
            fields:
              - name: title
                type: string
              - name: summary
                type: text
              - name: detail
                type: text
              - name: b1
                type: string
              - name: b2
                type: string
              - name: b3
                type: string
          - name: lines
            type: object
            fields:
              - name: title
                type: string
                description: '"服务线"小标题'
          - name: s1
            type: object
            label: AI 应用开发（旗舰）
            fields:
              - name: title
                type: string
              - name: body
                type: text
          - name: s2
            type: object
