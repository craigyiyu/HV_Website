# Pages CMS configuration for the HyperVelocity website
# See https://pagescms.org/docs/configuration for details.
# Content lives in content/*.json; each file has en/zh sections.

content:
  # ---------- Site basics ----------
  - name: site
    label: Site / 站点信息
    type: file
    path: content/site.json
    format: json
    fields:
      - name: en
        label: English
        type: object
        fields:
          - name: title
            type: string
            description: Browser tab title
          - name: meta.desc
            type: text
            description: SEO description
          - name: lang.toggle
            type: string
            description: Text of the language switch button (shows the OTHER language)
          - name: nav
            type: object
            label: Navigation menu
            fields:
              - name: services
                type: string
              - name: industries
                type: string
              - name: cases
                type: string
              - name: about
                type: string
              - name: contact
                type: string
              - name: cta
                type: string
                description: Header button text
          - name: typing
            type: object
            label: Typewriter words
            fields:
              - name: words
                type: string
                list: true
                description: 'Words that cycle in the "We build:" typewriter'
      - name: zh
        label: 中文
        type: object
        fields:
          - name: title
            type: string
            description: 浏览器标签页标题
          - name: meta.desc
            type: text
            description: SEO 描述
          - name: lang.toggle
            type: string
            description: 语言切换按钮文字（显示另一种语言）
          - name: nav
            type: object
            label: 导航菜单
            fields:
              - name: services
                type: string
              - name: industries
                type: string
              - name: cases
                type: string
              - name: about
                type: string
              - name: contact
                type: string
              - name: cta
                type: string
                description: 右上角按钮文字
          - name: typing
            type: object
            label: 打字机词表
            fields:
              - name: words
                type: string
                list: true
                description: '"We build:" 打字机循环的词'

  # ---------- Hero ----------
  - name: hero
    label: Hero / 首屏
    type: file
    path: content/hero.json
    format: json
    fields:
      - name: en
        label: English
        type: object
        fields:
          - name: badge
            type: string
            description: Small line above the headline (e.g. ~/HyperVelocity)
          - name: title
            type: string
            description: Main headline
          - name: lede
            type: text
            description: Intro paragraph. Words wrapped in span.agent-word get highlighted with AI agent carets
          - name: typelabel
            type: string
            description: 'Label before the typewriter (e.g. "We build:")'
          - name: cta1
            type: string
            description: Primary button (Contact us)
          - name: cta2
            type: string
            description: Secondary button (Explore services)
      - name: zh
        label: 中文
        type: object
        fields:
          - name: badge
            type: string
            description: 标题上方的小字
          - name: title
            type: string
            description: 主标题
          - name: lede
            type: text
            description: 首屏介绍段。用 span.agent-word 包裹的词会被高亮并带 AI 协作者光标
          - name: typelabel
            type: string
            description: '打字机前的标签（如"我们构建："）'
          - name: cta1
            type: string
            description: 主按钮（联系我们）
          - name: cta2
            type: string
            description: 次按钮（查看服务）

  # ---------- Services ----------
  - name: services
